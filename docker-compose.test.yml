# PostgreSQL for running the integration tests locally:
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgres://test:test@127.0.0.1:54329/test npm run test:integration
# Data lives in tmpfs and disappears when the container stops.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 2s
      timeout: 5s
      retries: 15
