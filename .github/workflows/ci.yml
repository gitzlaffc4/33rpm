name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The binding comes from the prebuilds bundled in the package (see .npmrc);
      # fail early and clearly if this platform has none.
      - name: Verify better-sqlite3 native binding
        run: node -e "const D=require('better-sqlite3'); console.log('SQLite', new D(':memory:').prepare('select sqlite_version() v').get().v)"
      # Audit only dependencies that can ship. Optional and peer-only packages are
      # excluded: e.g. better-auth lists vitest as an optional peer, which drags the
      # whole vitest/vite chain into a plain --omit=dev audit even though none of it
      # is in the standalone build. The Trivy scan covers what the image really contains.
      - name: Audit production dependencies
        run: npm audit --omit=dev --omit=optional --omit=peer --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  commitlint:
    name: Commit messages
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint commits in this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # Decides what the heavier jobs need: the Playwright version (for the container
  # tag) and whether the PR touches anything beyond docs.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      playwright: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Playwright version (exact pin from package.json)
        id: pw
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - name: Code or docs-only?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          echo "$files"
          # Docs and repo metadata can't change the app or the image.
          docs='^(docs/|LICENSE$|.*\.md$|\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|CODEOWNERS$|dependabot\.yml$))'
          if [ -n "$files" ] && ! grep -Eqv "$docs" <<< "$files"; then
            echo "Docs-only change: skipping build-heavy jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Playwright smoke test
    needs: changes
    # A job skipped by its condition reports success, so required checks still pass.
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Official Playwright image: browsers and their system libraries are preinstalled,
    # which replaces a slow apt-get step. The tag follows package.json, so a Dependabot
    # bump of @playwright/test moves the image with it.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/.server.log
          retention-days: 7

  # PRs only: on main the Release workflow builds and scans both architectures.
  docker:
    name: Docker build + Trivy (amd64)
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: 33rpm:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 33rpm:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy.sarif
          limit-severities-for-sarif: true
      # Fork PRs get a read-only token, so only upload for same-repo PRs and main.
      - name: Upload Trivy results
        if: ${{ always() && hashFiles('trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-ci-amd64
