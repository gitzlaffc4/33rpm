name: Release image (manual tag)

# Manual path: pushing a vX.Y.Z (or vX.Y.Z-alpha.N) tag that matches package.json.
# Tags created by release-please use GITHUB_TOKEN and therefore never trigger this
# workflow; release-please.yml publishes those itself.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Tag matches package.json
        id: version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "v$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          case "$pkg" in *-*) echo "channel=prerelease" ;; *) echo "channel=stable" ;; esac >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Verify better-sqlite3 native binding
        run: node -e "const D=require('better-sqlite3'); console.log('SQLite', new D(':memory:').prepare('select sqlite_version() v').get().v)"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  publish:
    name: Publish image
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/_build-image.yml
    with:
      ref: ${{ github.sha }}
      channel: ${{ needs.verify.outputs.channel }}
      version: ${{ needs.verify.outputs.version }}
